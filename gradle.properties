org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Замечание: на локальной ARM64-машине aapt2 из Google не запускается напрямую
# (он собран под x86_64) и включается через qemu-обёртку. Этот путь — особенность
# конкретной машины, поэтому он задаётся не здесь, а в ~/.gradle/gradle.properties:
#   android.aapt2FromMavenOverride=/путь/к/aapt2-override/aapt2
# В репозитории его быть не должно, иначе сборка в CI падает.
